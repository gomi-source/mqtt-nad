name: CI

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  # Builds and pushes a multi-arch image to Docker Hub. Only runs on a
  # semver tag push (e.g. "1.2.3"), so ordinary commits to main don't
  # publish an image.
  #
  # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN live under the "prd" GitHub
  # Environment (Settings -> Environments -> prd) rather than as plain
  # repo secrets/variables, so this job must declare `environment: prd`
  # below - without it, vars.DOCKERHUB_USERNAME and
  # secrets.DOCKERHUB_TOKEN resolve empty and the login step fails.
  push-image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/mqtt-nad:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USERNAME }}/mqtt-nad:latest
