stages:
  - test
  - build

variables:
  APP: $CI_PROJECT_NAME

test:
  stage: test
  image: golang:1.23-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"
  script:
    - go vet ./...
    - test -z "$(gofmt -l .)"
    - go test ./...

build:
  image: docker:24.0.5
  stage: build
  services:
    - docker:24.0.5-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED
  variables:
    ENV: prd
    CLUSTER: prd.subsoma.com
    DOCKER_TAG: $CI_COMMIT_TAG
    CI_REGISTRY: docker.io
    CI_REGISTRY_IMAGE: index.docker.io/$CI_REGISTRY_USER/mqtt-nad
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  environment:
    name: prd
    deployment_tier: production
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE:latest
